76.0" lengthAdjust="spacing">────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────</text><text x="24.4" y="329" fill="#ff9e64" font-weight="bold" textLength="84.0" lengthAdjust="spacing">Risk brief</text><text x="116.8" y="329" fill="#787c99">·</text><text x="133.6" y="329" fill="#e0af68" font-weight="bold" textLength="50.4" lengthAdjust="spacing">MEDIUM</text><text x="192.4" y="329" fill="#787c99" textLength="184.8" lengthAdjust="spacing">· $0.21 · v full brief</text><text x="24.4" y="347" fill="#c0caf5" textLength="932.4" lengthAdjust="spacing">Retries failed webhook deliveries up to 5 times with backoff and jitter, and logs every attempt to a new table.</text><text x="24.4" y="365" fill="#c0caf5" textLength="974.4" lengthAdjust="spacing">src/webhooks/deliver.ts:30-31 — Double delivery: 409 is retried, but many receivers use 409 for 'already processed'.</text><text x="24.4" y="383" fill="#c0caf5" textLength="873.6" lengthAdjust="spacing">src/webhooks/backoff.ts:1-7 — Unit mix-up: CAP_SECONDS is compared to milliseconds, so the cap is 300ms.</text><text x="24.4" y="401" fill="#c0caf5" textLength="739.2" lengthAdjust="spacing">migrations/0042_delivery_attempts.sql — New table on a hot path; one insert per attempt.</text><text x="16.0" y="419" fill="#3b4261" textLength="1176.0" lengthAdjust="spacing">────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────</text><text x="24.4" y="437" fill="#7aa2f7" font-weight="bold" textLength="58.8" lengthAdjust="spacing">Summary</text><text x="24.4" y="473" fill="#c0caf5" textLength="1117.2" lengthAdjust="spacing">Webhook deliveries used to be one-shot: a timeout or a 5xx dropped the event. This retries up to 5 times with exponential backoff and</text><text x="24.4" y="491" fill="#c0caf5" textLength="285.6" lengthAdjust="spacing">jitter, and records every attempt.</text><text x="24.4" y="527" fill="#7aa2f7" font-weight="bold" textLength="58.8" lengthAdjust="spacing">Changes</text><text x="24.4" y="563" fill="#ff9e64">•</text><text x="41.2" y="563" fill="#bb9af7" textLength="75.6" lengthAdjust="spacing">deliver()</text><text x="125.2" y="563" fill="#c0caf5" textLength="226.8" lengthAdjust="spacing">retries on 409, 429 and 5xx</text><text x="24.4" y="581" fill="#ff9e64">•</text><text x="41.2" y="581" fill="#c0caf5" textLength="25.2" lengthAdjust="spacing">new</text><text x="74.8" y="581" fill="#bb9af7" textLength="75.6" lengthAdjust="spacing">backoff()</text><text x="158.8" y="581" fill="#c0caf5" textLength="235.2" lengthAdjust="spacing">helper (full jitter, capped)</text><text x="24.4" y="599" fill="#ff9e64">•</text><text x="41.2" y="599" fill="#bb9af7" textLength="142.8" lengthAdjust="spacing">delivery_attempts</text><text x="192.4" y="599" fill="#c0caf5" textLength="193.2" lengthAdjust="spacing">table for the dashboard</text><text x="24.4" y="635" fill="#7aa2f7" font-weight="bold" textLength="58.8" lengthAdjust="spacing">Testing</text><text x="16.0" y="671" fill="#3b4261" textLength="1176.0" lengthAdjust="spacing">────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────</text><text x="24.4" y="689" fill="#ff9e64" textLength="25.2" lengthAdjust="spacing">esc</text><text x="58.0" y="689" fill="#787c99" textLength="33.6" lengthAdjust="spacing">back</text><text x="108.4" y="689" fill="#ff9e64" textLength="16.8" lengthAdjust="spacing">↑↓</text><text x="133.6" y="689" fill="#787c99" textLength="50.4" lengthAdjust="spacing">scroll</text><text x="200.8" y="689" fill="#ff9e64">r</text><text x="217.6" y="689" fill="#787c99" textLength="58.8" lengthAdjust="spacing">refresh</text><text x="293.2" y="689" fill="#ff9e64">d</text><text x="310.0" y="689" fill="#787c99" textLength="33.6" lengthAdjust="spacing">diff</text><text x="360.4" y="689" fill="#ff9e6