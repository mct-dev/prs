<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" style="white-space:pre" xml:space="preserve"><text x="24.4" y="59" fill="#c0caf5" font-weight="bold" textLength="33.6" lengthAdjust="spacing">HOME</text><text x="1133.2" y="59" fill="#787c99" textLength="50.4" lengthAdjust="spacing">@alice</text><text x="16.0" y="77" fill="#3b4261" textLength="1176.0" lengthAdjust="spacing">────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────</text><text x="24.4" y="95" fill="#c0caf5" font-weight="bold" textLength="369.6" lengthAdjust="spacing">Retry failed webhook deliveries with backoff</text><text x="24.4" y="113" fill="#ff9e64" textLength="33.6" lengthAdjust="spacing">#482</text><text x="66.4" y="113" fill="#787c99" textLength="16.8" lengthAdjust="spacing">by</text><text x="91.6" y="113" fill="#ff9e64" textLength="42.0" lengthAdjust="spacing">devon</text><text x="142.0" y="113" fill="#787c99" textLength="75.6" lengthAdjust="spacing">yesterday</text><text x="1099.6" y="113" fill="#787c99" textLength="84.0" lengthAdjust="spacing">5 comments</text><text x="24.4" y="131" fill="#787c99" textLength="176.4" lengthAdjust="spacing">devon/webhook-retries</text><text x="1066.0" y="131" fill="#787c99" textLength="58.8" lengthAdjust="spacing">3 files</text><text x="1133.2" y="131" fill="#9ece6a" textLength="25.2" lengthAdjust="spacing">+35</text><text x="1166.8" y="131" fill="#f7768e" textLength="16.8" lengthAdjust="spacing">-2</text><text x="32.8" y="149" fill="#111111" textLength="92.4" lengthAdjust="spacing">enhancement</text><text x="24.4" y="167" fill="#787c99" textLength="92.4" lengthAdjust="spacing">Reviewers ·</text><text x="125.2" y="167" fill="#e0af68" textLength="109.2" lengthAdjust="spacing">0/1 approvals</text><text x="251.2" y="167" fill="#e0af68">◐</text><text x="268.0" y="167" fill="#ff9e64" textLength="92.4" lengthAdjust="spacing">