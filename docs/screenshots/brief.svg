<svg xmlns="http://www.w3.org/2000/svg" width="1208" height="710" viewBox="0 0 1208 710" role="img" aria-label="prs: agent review brief">
<title>prs: agent review brief</title>
<rect width="1208" height="710" rx="10" fill="#1a1b26"/>
<circle cx="22" cy="17" r="6" fill="#ff5f57"/><circle cx="42" cy="17" r="6" fill="#febc2e"/><circle cx="62" cy="17" r="6" fill="#28c840"/>
<g shape-rendering="crispEdges"><rect x="16.0" y="298" width="1176.0" height="18" fill="#283457"/><rect x="16.0" y="316" width="1176.0" height="18" fill="#283457"/></g>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" style="white-space:pre" xml:space="preserve"><text x="24.4" y="59" fill="#c0caf5" font-weight="bold" textLength="33.6" lengthAdjust="spacing">HOME</text><text x="1133.2" y="59" fill="#787c99" textLength="50.4" lengthAdjust="spacing">@alice</text><text x="16.0" y="77" fill="#3b4261" textLength="1176.0" lengthAdjust="spacing">────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────</text><text x="24.4" y="95" fill="#7aa2f7" font-weight="bold" textLength="193.2" lengthAdjust="spacing">api #482 · agent review</text><text x="1057.6" y="95" fill="#787c99" textLength="126.0" lengthAdjust="spacing">read-only brief</text><text x="24.4" y="113" fill="#787c99" textLength="369.6" lengthAdjust="spacing">Retry failed webhook deliveries with backoff</text><text x="410.8" y="113" fill="#787c99" textLength="67.2" lengthAdjust="spacing">↓ 3 more</text><text x="16.0" y="131" fill="#3b4261" textLength="1176.0" lengthAdjust="spacing">────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────</text><text x="24.4" y="149" fill="#787c99" textLength="33.6" lengthAdjust="spacing">Risk</text><text x="66.4" y="149" fill="#e0af68" font-weight="bold" textLength="50.4" lengthAdjust="spacing">MEDIUM</text><text x="125.2" y="149" fill="#787c99" textLength="100.8" lengthAdjust="spacing">· confidence</text><text x="234.4" y="149" fill="#e0af68" textLength="50.4" lengthAdjust="spacing">medium</text><text x="24.4" y="185" fill="#ff9e64" font-weight="bold" textLength="58.8" lengthAdjust="spacing">Summary</text><text x="24.4" y="203" fill="#c0caf5" textLength="932.4" lengthAdjust="spacing">Retries failed webhook deliveries up to 5 times with backoff and jitter, and logs every attempt to a new table.</text><text x="24.4" y="239" fill="#ff9e64" font-weight="bold" textLength="117.6" lengthAdjust="spacing">Before / after</text><text x="24.4" y="257" fill="#c0caf5" textLength="882.0" lengthAdjust="spacing">Before: one attempt, failures dropped. After: up to 5 attempts; the last failure marks the delivery dead.</text><text x="24.4" y="293" fill="#ff9e64" font-weight="bold" textLength="92.4" lengthAdjust="spacing">Focus areas</text><text x="125.2" y="293" fill="#787c99" textLength="218.4" lengthAdjust="spacing">(3) · enter opens the diff</text><text x="24.4" y="311" fill="#f7768e" font-weight="bold" textLength="33.6" lengthAdjust="spacing">high</text><text x="66.4" y="311" fill="#c0caf5" textLength="243.6" lengthAdjust="spacing">src/webhooks/deliver.ts:30-31</text><text x="58.0" y="329" fill="#787c99" textLength="705.6" lengthAdjust="spacing">Double delivery: 409 is retried, but many receivers use 409 for 'already processed'.</text><text x="24.4" y="347" fill="#e0af68" font-weight="bold" textLength="25.2" lengthAdjust="spacing">med</text><text x="66.4" y="347" fill="#c0caf5" textLength="226.8" lengthAdjust="spacing">src/webhooks/backoff.ts:1-7</text><text x="58.0" y="365" fill="#787c99" textLength="621.6" lengthAdjust="spacing">Unit mix-up: CAP_SECONDS is compared to milliseconds, so the cap is 300ms.</text><text x="24.4" y="383" fill="#9ece6a" font-weight="bold" textLength="25.2" lengthAdjust="spacing">low</text><text x="66.4" y="383" fill="#c0caf5" textLength="310.8" lengthAdjust="spacing">migrations/0042_delivery_attempts.sql</text><text x="58.0" y="401" fill="#787c99" textLength="403.2" lengthAdjust="spacing">New table on a hot path; one insert per attempt.</text><text x="24.4" y="437" fill="#ff9e64" font-weight="bold" textLength="100.8" lengthAdjust="spacing">Safe to skip</text><text x="133.6" y="437" fill="#787c99" textLength="25.2" lengthAdjust="spacing">(2)</text><text x="24.4" y="455" fill="#c0caf5" textLength="344.4" lengthAdjust="spacing">test/webhooks/*.test.ts — New tests only.</text><text x="24.4" y="473" fill="#c0caf5" textLength="201.6" lengthAdjust="spacing">docs/webhooks.md — Docs.</text><text x="24.4" y="509" fill="#ff9e64" font-weight="bold" textLength="75.6" lengthAdjust="spacing">Questions</text><text x="24.4" y="527" fill="#c0caf5" textLength="268.8" lengthAdjust="spacing">• Should 409 count as delivered?</text><text x="24.4" y="545" fill="#c0caf5" textLength="344.4" lengthAdjust="spacing">• Is 5 attempts right for slow receivers?</text><text x="24.4" y="581" fill="#ff9e64" font-weight="bold" textLength="42.0" lengthAdjust="spacing">Tests</text><text x="24.4" y="599" fill="#c0caf5" textLength="462.0" lengthAdjust="spacing">Retry loop and backoff are tested. The 409 path is not.</text><text x="24.4" y="635" fill="#ff9e64" font-weight="bold" textLength="25.2" lengthAdjust="spacing">Run</text><text x="24.4" y="653" fill="#787c99" textLength="50.4" lengthAdjust="spacing">Preset</text><text x="108.4" y="653" fill="#c0caf5" textLength="226.8" lengthAdjust="spacing">default · claude · worktree</text><text x="16.0" y="671" fill="#3b4261" textLength="1176.0" lengthAdjust="spacing">────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────</text><text x="24.4" y="689" fill="#ff9e64" textLength="25.2" lengthAdjust="spacing">esc</text><text x="58.0" y="689" fill="#787c99" textLength="33.6" lengthAdjust="spacing">back</text><text x="108.4" y="689" fill="#ff9e64" textLength="16.8" lengthAdjust="spacing">↑↓</text><text x="133.6" y="689" fill="#787c99" textLength="42.0" lengthAdjust="spacing">focus</text><text x="192.4" y="689" fill="#ff9e64" textLength="42.0" lengthAdjust="spacing">enter</text><text x="242.8" y="689" fill="#787c99" textLength="33.6" lengthAdjust="spacing">diff</text><text x="293.2" y="689" fill="#ff9e64">L</text><text x="310.0" y="689" fill="#787c99" textLength="25.2" lengthAdjust="spacing">log</text><text x="352.0" y="689" fill="#ff9e64">o</text><text x="368.8" y="689" fill="#787c99" textLength="58.8" lengthAdjust="spacing">browser</text><text x="444.4" y="689" fill="#ff9e64" textLength="25.2" lengthAdjust="spacing">b/B</text><text x="478.0" y="689" fill="#787c99" textLength="50.4" lengthAdjust="spacing">review</text></g>
</svg>
