<svg xmlns="http://www.w3.org/2000/svg" width="1208" height="710" viewBox="0 0 1208 710" role="img" aria-label="prs: comments view">
<title>prs: comments view</title>
<rect width="1208" height="710" rx="10" fill="#1a1b26"/>
<circle cx="22" cy="17" r="6" fill="#ff5f57"/><circle cx="42" cy="17" r="6" fill="#febc2e"/><circle cx="62" cy="17" r="6" fill="#28c840"/>
<g shape-rendering="crispEdges"></g>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" style="white-space:pre" xml:space="preserve"><text x="24.4" y="59" fill="#c0caf5" font-weight="bold" textLength="33.6" lengthAdjust="spacing">HOME</text><text x="1133.2" y="59" fill="#787c99" textLength="50.4" lengthAdjust="spacing">@alice</text><text x="16.0" y="77" fill="#3b4261" textLength="1176.0" lengthAdjust="spacing">────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────</text><text x="24.4" y="95" fill="#7aa2f7" font-weight="bold" textLength="109.2" lengthAdjust="spacing">Comments #482</text><text x="150.4" y="95" fill="#7aa2f7" font-weight="bold" textLength="25.2" lengthAdjust="spacing">api</text><text x="1099.6" y="95" fill="#787c99" textLength="84.0" lengthAdjust="spacing">5 comments</text><text x="16.0" y="113" fill="#3b4261" textLength="1176.0" lengthAdjust="spacing">────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────</text><text x="16.0" y="131" fill="#7aa2f7" font-weight="bold" textLength="210.0" lengthAdjust="spacing">● nina · 1h ago · general</text><text x="32.8" y="149" fill="#c0caf5" textLength="798.0" lengthAdjust="spacing">Nice. Can we cap total retry time too, so a dead endpoint doesn't hold a worker for 15 minutes?</text><text x="16.0" y="185" fill="#ff9e64" font-weight="bold">●</text><text x="32.8" y="185" fill="#ff9e64" font-weight="bold" textLength="33.6" lengthAdjust="spacing">mira</text><text x="74.8" y="185" fill="#787c99" textLength="84.0" lengthAdjust="spacing">· 1h ago ·</text><text x="167.2" y="185" fill="#bb9af7" textLength="218.4" lengthAdjust="spacing">src/webhooks/deliver.ts:30</text><text x="32.8" y="203" fill="#c0caf5" textLength="92.4" lengthAdjust="spacing">Retrying on</text><text x="133.6" y="203" fill="#bb9af7" textLength="25.2" lengthAdjust="spacing">409</text><text x="167.2" y="203" fill="#c0caf5" textLength="344.4" lengthAdjust="spacing">worries me. Some receivers return 409 for</text><text x="520.0" y="203" fill="#c0caf5" font-style="italic" textLength="142.8" lengthAdjust="spacing">already processed</text><text x="662.8" y="203" fill="#c0caf5" textLength="336.0" lengthAdjust="spacing">, so we'd re-send an event they handled.</text><text x="49.6" y="239" fill="#787c99" font-weight="bold">↳</text><text x="66.4" y="239" fill="#ff9e64" font-weight="bold" textLength="42.0" lengthAdjust="spacing">devon</text><text x="116.8" y="239" fill="#787c99" textLength="75.6" lengthAdjust="spacing">· 52m ago</text><text x="66.4" y="257" fill="#c0caf5" textLength="520.8" lengthAdjust="spacing">Good point. I'll treat 409 as delivered and add a test for it.</text><text x="16.0" y="293" fill="#ff9e64" font-weight="bold">●</text><text x="32.8" y="293" fill="#ff9e64" font-weight="bold" textLength="33.6" lengthAdjust="spacing">tess</text><text x="74.8" y="293" fill="#787c99" textLength="92.4" lengthAdjust="spacing">· 30m ago ·</text><text x="175.6" y="293" fill="#bb9af7" textLength="210.0" lengthAdjust="spacing">src/webhooks/backoff.ts:6</text><text x="32.8" y="311" fill="#bb9af7" textLength="92.4" lengthAdjust="spacing">CAP_SECONDS</text><text x="133.6" y="311" fill="#c0caf5" textLength="117.6" lengthAdjust="spacing">is seconds but</text><text x="259.6" y="311" fill="#bb9af7" textLength="58.8" lengthAdjust="spacing">BASE_MS</text><text x="326.8" y="311" fill="#c0caf5" textLength="352.8" lengthAdjust="spacing">is ms, so the cap is 300ms, not 5 minutes.</text><text x="16.0" y="347" fill="#ff9e64" font-weight="bold">●</text><text x="32.8" y="347" fill="#ff9e64" font-weight="bold" textLength="50.4" lengthAdjust="spacing">ci-bot</text><text x="91.6" y="347" fill="#787c99" textLength="210.0" lengthAdjust="spacing">[bot] · 14m ago · general</text><text x="32.8" y="365" fill="#c0caf5" textLength="75.6" lengthAdjust="spacing">Coverage:</text><text x="116.8" y="365" fill="#c0caf5" font-weight="bold" textLength="42.0" lengthAdjust="spacing">91.4%</text><text x="167.2" y="365" fill="#c0caf5" textLength="210.0" lengthAdjust="spacing">(+0.6%) · 3 files changed</text><text x="16.0" y="401" fill="#787c99" textLength="142.8" lengthAdjust="spacing">+ Add new comment</text><text x="16.0" y="671" fill="#3b4261" textLength="1176.0" lengthAdjust="spacing">────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────</text><text x="24.4" y="689" fill="#ff9e64" textLength="16.8" lengthAdjust="spacing">↑↓</text><text x="49.6" y="689" fill="#787c99" textLength="33.6" lengthAdjust="spacing">move</text><text x="100.0" y="689" fill="#ff9e64" textLength="42.0" lengthAdjust="spacing">enter</text><text x="150.4" y="689" fill="#787c99" textLength="42.0" lengthAdjust="spacing">reply</text><text x="209.2" y="689" fill="#ff9e64" textLength="42.0" lengthAdjust="spacing">space</text><text x="259.6" y="689" fill="#787c99" textLength="33.6" lengthAdjust="spacing">fold</text><text x="310.0" y="689" fill="#ff9e64">t</text><text x="326.8" y="689" fill="#787c99" textLength="58.8" lengthAdjust="spacing">details</text><text x="402.4" y="689" fill="#ff9e64" textLength="25.2" lengthAdjust="spacing">1-9</text><text x="436.0" y="689" fill="#787c99" textLength="33.6" lengthAdjust="spacing">link</text><text x="486.4" y="689" fill="#ff9e64">a</text><text x="503.2" y="689" fill="#787c99" textLength="25.2" lengthAdjust="spacing">new</text><text x="545.2" y="689" fill="#3b4261" textLength="50.4" lengthAdjust="spacing">e edit</text><text x="612.4" y="689" fill="#3b4261" textLength="67.2" lengthAdjust="spacing">x delete</text><text x="696.4" y="689" fill="#ff9e64">o</text><text x="713.2" y="689" fill="#787c99" textLength="33.6" lengthAdjust="spacing">open</text><text x="763.6" y="689" fill="#ff9e64">r</text><text x="780.4" y="689" fill="#787c99" textLength="58.8" lengthAdjust="spacing">refresh</text><text x="856.0" y="689" fill="#ff9e64" textLength="25.2" lengthAdjust="spacing">esc</text><text x="889.6" y="689" fill="#787c99" textLength="42.0" lengthAdjust="spacing">close</text></g>
</svg>
